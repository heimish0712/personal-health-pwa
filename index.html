<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="개인용 건강 기록 PWA">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/layout.css">
  <title>개인 건강 기록</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">PERSONAL HEALTH</p>
        <h1 id="page-title">홈</h1>
      </div>
      <button id="settings-button" class="icon-button" type="button" aria-label="설정 열기">⚙</button>
    </header>

    <main id="page-root" class="page-root" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="주요 메뉴"></nav>
  </div>

  <section id="update-banner" class="update-banner" hidden aria-live="polite">
    <div>
      <strong>새 버전이 있습니다.</strong>
      <p>작성 중인 내용이 없다면 업데이트할 수 있습니다.</p>
    </div>
    <div class="update-actions">
      <button id="update-later" class="button button-secondary" type="button">나중에</button>
      <button id="update-now" class="button" type="button">업데이트</button>
    </div>
  </section>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="./js/config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
